# ============ 服务端口 ============
server:
  port: 8080

spring:
  application:
    name: project-a

  # ============ MySQL（项目A 业务库）============
  # 端口是 3307，不是 3306 —— 本机 3306 已被另一个 MySQL 占用
  datasource:
    url: jdbc:mysql://localhost:3307/it_service_desk?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============ Redis ============
  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    time-zone: Asia/Shanghai

# ============ Actuator ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.example.projecta: debug